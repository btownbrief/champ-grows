<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Champ Grows</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06283d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Champ Grows">
<meta name="description" content="Champ Grows: a snake game on Lake Champlain. Swim, eat fish, grow long, don't tangle.">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
<!-- GoatCounter -->
<script data-goatcounter="https://btown-brief.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<canvas id="c" aria-label="Lake Champlain play area"></canvas>

<!-- measuring probes for safe areas -->
<div id="probe" aria-hidden="true"></div>

<!-- In-game HUD -->
<header id="hud" class="hidden">
  <div class="hud-score">
    <span class="lbl">SCORE</span>
    <span id="sc" class="num">0</span>
  </div>
  <div id="streak" class="streak off" style="--p:1">
    <div class="ring"></div>
    <b id="stx">x2</b>
  </div>
  <div class="hud-best">
    <span class="lbl">BEST</span>
    <span id="scBest" class="num2">0</span>
  </div>
  <div class="hud-btns">
    <button id="btnMuteHud" class="ibtn" aria-label="Sound on or off"></button>
    <button id="btnPause" class="ibtn" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
    </button>
  </div>
</header>

<div id="ghost" class="hidden" aria-hidden="true">
  <div class="trail"></div>
  <div class="finger"></div>
  <div class="say">Swipe to steer</div>
</div>
<div id="keyhint" class="hidden">Arrow keys or WASD to steer</div>
<div id="banner" class="hidden"></div>

<!-- Title -->
<section id="title" class="screen">
  <div class="title-wrap">
    <div class="logo-block">
      <div class="logo" role="img" aria-label="Champ Grows">
        <span class="l1" data-t="CHAMP">CHAMP</span>
        <span class="l2" data-t="GROWS">GROWS</span>
      </div>
      <div class="tag">A snake game on Lake Champlain</div>
    </div>
    <div class="title-controls">
      <button id="btnPlay" class="play">
        <span>PLAY</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      </button>
      <div id="modeBlurb" class="blurb"></div>
      <button id="taskChip" class="taskchip"></button>
      <div id="modes" class="modes"></div>
      <div class="row2">
        <div id="speedSeg" class="seg" role="group" aria-label="Speed">
          <button data-speed="chill">Chill</button>
          <button data-speed="normal">Normal</button>
          <button data-speed="fast">Fast</button>
        </div>
        <button id="btnSkin" class="ibtn big skinbtn" aria-label="Champ's look"><canvas></canvas></button>
        <button id="btnSfx" class="ibtn big" aria-label="Sound effects"></button>
        <button id="btnMusic" class="ibtn big" aria-label="Music"></button>
      </div>
    </div>
  </div>
</section>

<!-- Pause -->
<section id="pause" class="screen hidden">
  <div class="card">
    <h2>Paused</h2>
    <button id="btnResume" class="btn primary">Keep swimming</button>
    <button id="btnRestart" class="btn">Restart</button>
    <button id="btnMenu" class="btn">Menu</button>
    <div class="row3">
      <button id="btnSfx2" class="ibtn big" aria-label="Sound effects"></button>
      <button id="btnMusic2" class="ibtn big" aria-label="Music"></button>
    </div>
  </div>
</section>

<!-- Daily tasks -->
<section id="tasks" class="screen hidden">
  <div class="card">
    <h2>Today's tasks</h2>
    <p class="msg">Three new ones every day, in any mode.</p>
    <div id="taskList" class="ov-tasks big"></div>
    <p id="taskReward" class="nx-s"></p>
    <button id="btnTasksDone" class="btn primary">Let's swim</button>
  </div>
</section>

<!-- Champ's look -->
<section id="skins" class="screen hidden">
  <div class="card skins">
    <h2>Champ's look</h2>
    <p class="msg">Play to unlock new looks. Champ grows!</p>
    <div id="skinGrid" class="skgrid"></div>
    <button id="btnSkinsDone" class="btn primary">Done</button>
  </div>
</section>

<!-- Game over: one number, one goal, one button. Everything else sits behind Details. -->
<section id="over" class="screen hidden">
  <div class="card over">
    <h2 id="ovTitle" class="ov-word">Tangled!</h2>
    <div class="ov-score"><span id="ovScore">0</span></div>
    <div id="ovBest" class="ov-best"></div>
    <div id="ovGoal" class="ov-goal hidden"></div>
    <button id="btnAgain" class="btn primary huge">Swim again</button>
    <div class="ov-row">
      <button id="btnDetails" class="btn sm" aria-expanded="false">Details</button>
      <button id="btnMenu2" class="btn sm">Change mode</button>
    </div>
    <div id="ovMore" class="ov-more hidden">
      <p id="ovMsg" class="msg"></p>
      <div id="ovStats" class="ov-stats"></div>
      <div id="ovUnlock" class="ov-unlock hidden"></div>
      <div id="ovMedals" class="ov-medals hidden"></div>
      <div id="ovNext" class="ov-next hidden"></div>
      <div id="ovTasks" class="ov-tasks"></div>
    </div>
  </div>
</section>

<script src="audio.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
